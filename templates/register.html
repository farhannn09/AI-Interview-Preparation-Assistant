<!DOCTYPE html>
<html>

<head>

    <title>Create Account - AI Interview Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 80px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 10px;
            padding: 5px;
            border: none;
            background: none;
            color: #007bff;
            cursor: pointer;
        }

        .button {
            width: 100%;
            padding: 13px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your AI Interview Assistant account
        </p>


        <form method="POST"
              action="/register"
              onsubmit="return validateRegistration()">


            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label for="password">
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Minimum 6 characters"
                    required>

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('password', this)">

                    Show

                </button>

            </div>


            <label for="confirm_password">
                Confirm Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter your password"
                    required>

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('confirm_password', this)">

                    Show

                </button>

            </div>


            <button
                type="submit"
                class="button">

                Create Account

            </button>

        </form>


        <div class="login">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</div>


<script>

function togglePassword(id, button) {

    const password =
        document.getElementById(id);


    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }

}


function validateRegistration() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm_password").value;


    if (name.length < 2) {

        alert("Please enter your full name.");

        return false;

    }


    if (!email.includes("@") ||
        !email.includes(".")) {

        alert("Please enter a valid email address.");

        return false;

    }


    if (password.length < 6) {

        alert(
            "Password must contain at least 6 characters."
        );

        return false;

    }


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return false;

    }


    return true;

}

</script>

</body>

</html>
