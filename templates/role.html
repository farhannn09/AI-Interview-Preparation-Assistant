<!DOCTYPE html>
<html>
<head>
    <title>Select Job Role</title>
</head>

<body>

    <h1>Select Job Role</h1>

    <form method="POST">

        <label>Select your job role:</label>

        <select name="job_role" required>

            <option value="">-- Select Job Role --</option>

            <option value="Software Developer">
                Software Developer
            </option>

            <option value="Java Developer">
                Java Developer
            </option>

            <option value="Python Developer">
                Python Developer
            </option>

            <option value="Data Analyst">
                Data Analyst
            </option>

            <option value="Data Scientist">
                Data Scientist
            </option>

            <option value="Machine Learning Engineer">
                Machine Learning Engineer
            </option>

            <option value="AI Engineer">
                AI Engineer
            </option>

            <option value="Web Developer">
                Web Developer
            </option>

        </select>

        <br><br>

        <button type="submit">
            Continue
        </button>

    </form>

    <br>

    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>
</html>
