<!DOCTYPE html>
<html>

<head>

    <title>AI Interview Assistant</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-color: #1f2937;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .nav-links a:hover {
            color: #60a5fa;
        }

        .hero {
            max-width: 900px;
            margin: 100px auto;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 45px;

        .hero p {

<nav class="navbar">
