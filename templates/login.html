<!DOCTYPE html>
<html>

<head>

    <title>Login - AI Interview Assistant</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            padding-right: 80px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 10px;
            padding: 5px;
            border: none;
            background: none;
            color: #007bff;
            cursor: pointer;
        }

        .button {
            width: 100%;
            padding: 13px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to your AI Interview Assistant
        </p>

        <form method="POST"
              action="/login"
              onsubmit="return validateLogin()">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>


            <label for="password">
                Password
            </label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()">

                    Show

                </button>

            </div>


            <button
                type="submit"
                class="button">

                Login

            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".toggle-password");


    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }

}


function validateLogin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email.includes("@")) {

        alert("Please enter a valid email address.");

        return false;

    }


    if (password.length < 6) {

        alert("Password must contain at least 6 characters.");

        return false;

    }


    return true;

}

</script>

</body>

</html>
