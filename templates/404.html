<!DOCTYPE html>
<html>

<head>

    <title>Page Not Found</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 80px 20px;
        }

        .card {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 45px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 70px;
            margin: 0;
            color: #007bff;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 12px 22px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .button:hover {
            background-color: #0056b3;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>404</h1>

    <h2>Page Not Found</h2>

    <p>
        Sorry, the page you are looking for
        does not exist.
    </p>

    <a href="/dashboard" class="button">
        Go to Dashboard
    </a>

</div>

</body>

</html>
